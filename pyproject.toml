[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-quality-engineering"
version = "0.1.0"
description = "Agentic Quality Engineering PoC for evals, differential testing, observability, evidence and risk-based release decisions."
requires-python = ">=3.11"
authors = [{ name = "Javier Capa" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
agentic-qe = "agentic_qe.pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
