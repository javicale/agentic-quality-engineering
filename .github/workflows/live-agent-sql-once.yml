name: Live Agentic QE SQL — One Time

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-agent-sql-once.yml

permissions:
  contents: read

jobs:
  live-agent-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENTIC_QE_MODEL: gpt-5.6-luna

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require configured API secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install live agent dependencies
        run: python -m pip install -e ".[agent]"

      - name: Generate live SQL validation plan through MCP
        run: |
          agentic-qe plan \
            --scenario examples/sql-etl-reconciliation/scenario.json \
            --provider openai \
            --model gpt-5.6-luna \
            --output live-sql-plan-result.json

      - name: Execute SQL differential using saved agent plan
        run: |
          set +e
          agentic-qe-sql \
            --scenario examples/sql-etl-reconciliation/scenario.json \
            --candidate-query good \
            --plan-source file \
            --plan live-sql-plan-result.json \
            --output live-sql-artifacts \
            --enforce-release
          echo $? > live-sql-exit-code.txt
          exit 0

      - name: Upload live SQL planning and evidence artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-agentic-qe-sql-evidence
          path: |
            live-sql-plan-result.json
            live-sql-artifacts/
            live-sql-exit-code.txt
          retention-days: 14
          if-no-files-found: error

      - name: Enforce live SQL release signal after evidence upload
        run: |
          code=$(cat live-sql-exit-code.txt)
          if [ "$code" -ne 0 ]; then
            echo "Live SQL pipeline returned non-zero release gate code: $code"
            exit "$code"
          fi
