name: Live Agentic QE V4 Traceability — One Time

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-v4-traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENTIC_QE_MODEL: gpt-5.6-luna

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require configured API secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install live agent dependencies
        run: python -m pip install -e ".[agent]"

      - name: Generate V4 SQL validation plan through MCP
        run: |
          agentic-qe plan \
            --scenario examples/sql-etl-reconciliation/scenario.json \
            --provider openai \
            --model gpt-5.6-luna \
            --candidate-query good \
            --output final-live-plan.json

      - name: Execute V4 SQL validation with plan traceability
        run: |
          set +e
          agentic-qe-sql \
            --scenario examples/sql-etl-reconciliation/scenario.json \
            --candidate-query good \
            --plan-source file \
            --plan final-live-plan.json \
            --output final-live-artifacts \
            --enforce-release
          echo $? > final-live-exit-code.txt
          exit 0

      - name: Upload final V4 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-live-v4-traceability-evidence
          path: |
            final-live-plan.json
            final-live-artifacts/
            final-live-exit-code.txt
          retention-days: 14
          if-no-files-found: error

      - name: Enforce V4 release after evidence upload
        run: |
          code=$(cat final-live-exit-code.txt)
          if [ "$code" -ne 0 ]; then
            echo "V4 live pipeline returned non-zero release gate code: $code"
            exit "$code"
          fi
