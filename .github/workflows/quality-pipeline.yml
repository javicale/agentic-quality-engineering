name: Agentic QE Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core package
        run: python -m pip install -e ".[dev]"

      - name: Run core tests
        run: pytest -m "not integration and not database_integration"

      - name: Execute reference CSV quality pipeline
        run: |
          agentic-qe run \
            --scenario examples/etl-decimal-precision/scenario.json \
            --candidate examples/etl-decimal-precision/candidate-good.csv \
            --output artifacts \
            --enforce-release
          grep -q '"status": "PASS"' artifacts/plan-traceability.json

      - name: Prove weak agent plan is blocked before execution
        run: |
          set +e
          agentic-qe run \
            --scenario examples/etl-decimal-precision/scenario.json \
            --candidate examples/etl-decimal-precision/candidate-good.csv \
            --plan-source file \
            --plan examples/etl-decimal-precision/agent-proposal-weak.json \
            --output artifacts-weak-plan \
            --enforce-release
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '"status": "BLOCKED"' artifacts-weak-plan/execution-gate.json

      - name: Prove unsupported HIGH scenario overrides green differential
        run: |
          set +e
          agentic-qe run \
            --scenario examples/etl-decimal-precision/scenario.json \
            --candidate examples/etl-decimal-precision/candidate-good.csv \
            --plan-source file \
            --plan examples/etl-decimal-precision/agent-proposal-unsupported.json \
            --output artifacts-unsupported-plan \
            --enforce-release
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '"mapping_status": "UNSUPPORTED"' artifacts-unsupported-plan/plan-traceability.json
          grep -q '"decision": "NO_GO"' artifacts-unsupported-plan/release-signal.json

      - name: Execute SQL differential good path
        run: |
          agentic-qe-sql \
            --scenario examples/sql-etl-reconciliation/scenario.json \
            --candidate-query good \
            --output sql-artifacts-good \
            --enforce-release
          grep -q '"difference_count": 0' sql-artifacts-good/database-differential.json
          grep -q '"status": "PASS"' sql-artifacts-good/plan-traceability.json
          grep -q '"scenario_level_traceability": "IMPLEMENTED"' sql-artifacts-good/execution-scope.json

      - name: Prove SQL regression forces NO_GO
        run: |
          set +e
          agentic-qe-sql \
            --scenario examples/sql-etl-reconciliation/scenario.json \
            --candidate-query regression \
            --output sql-artifacts-regression \
            --enforce-release
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '"decision": "NO_GO"' sql-artifacts-regression/release-signal.json
          grep -q '"status": "BLOCKED"' sql-artifacts-regression/plan-traceability.json

      - name: Prove SQL schema drift forces NO_GO
        run: |
          set +e
          agentic-qe-sql \
            --scenario examples/sql-etl-reconciliation/scenario.json \
            --candidate-query schema_drift \
            --output sql-artifacts-schema-drift \
            --enforce-release
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '"row_key": "__schema__"' sql-artifacts-schema-drift/database-differential.json

      - name: Upload decision-grade evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentic-qe-evidence
          path: |
            artifacts/
            artifacts-weak-plan/
            artifacts-unsupported-plan/
            sql-artifacts-good/
            sql-artifacts-regression/
            sql-artifacts-schema-drift/
          retention-days: 14
          if-no-files-found: error

  agent-mcp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Agent + MCP integrations
        run: python -m pip install -e ".[dev,agent]"

      - name: Test MCP and OpenAI agent adapter contracts without API calls
        run: pytest tests/integration

  database-portability-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SQLAlchemy integration
        run: python -m pip install -e ".[dev,database]"

      - name: Test environment-backed SQLAlchemy adapter
        run: pytest -m database_integration
