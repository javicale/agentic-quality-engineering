name: Live Agentic QE Planning

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model used only for validation-plan generation
        required: true
        default: gpt-5.6-luna
        type: string
      experiment:
        description: Synthetic experiment/candidate to plan and validate
        required: true
        default: csv-good
        type: choice
        options:
          - csv-good
          - csv-regression
          - sql-good
          - sql-regression
          - sql-schema-drift

permissions:
  contents: read

jobs:
  live-agent-plan-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENTIC_QE_MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require configured API secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required for this manual workflow."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install live agent dependencies
        run: python -m pip install -e ".[agent]"

      - name: Resolve experiment
        id: target
        shell: bash
        run: |
          case "${{ inputs.experiment }}" in
            csv-good)
              echo "kind=csv" >> "$GITHUB_OUTPUT"
              echo "scenario=examples/etl-decimal-precision/scenario.json" >> "$GITHUB_OUTPUT"
              echo "candidate=candidate-good.csv" >> "$GITHUB_OUTPUT"
              ;;
            csv-regression)
              echo "kind=csv" >> "$GITHUB_OUTPUT"
              echo "scenario=examples/etl-decimal-precision/scenario.json" >> "$GITHUB_OUTPUT"
              echo "candidate=candidate-regression.csv" >> "$GITHUB_OUTPUT"
              ;;
            sql-good)
              echo "kind=sql" >> "$GITHUB_OUTPUT"
              echo "scenario=examples/sql-etl-reconciliation/scenario.json" >> "$GITHUB_OUTPUT"
              echo "candidate=good" >> "$GITHUB_OUTPUT"
              ;;
            sql-regression)
              echo "kind=sql" >> "$GITHUB_OUTPUT"
              echo "scenario=examples/sql-etl-reconciliation/scenario.json" >> "$GITHUB_OUTPUT"
              echo "candidate=regression" >> "$GITHUB_OUTPUT"
              ;;
            sql-schema-drift)
              echo "kind=sql" >> "$GITHUB_OUTPUT"
              echo "scenario=examples/sql-etl-reconciliation/scenario.json" >> "$GITHUB_OUTPUT"
              echo "candidate=schema_drift" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Generate live agent validation plan through MCP
        shell: bash
        run: |
          if [ "${{ steps.target.outputs.kind }}" = "sql" ]; then
            agentic-qe plan \
              --scenario "${{ steps.target.outputs.scenario }}" \
              --provider openai \
              --model "${{ inputs.model }}" \
              --candidate-query "${{ steps.target.outputs.candidate }}" \
              --output live-plan-result.json
          else
            agentic-qe plan \
              --scenario "${{ steps.target.outputs.scenario }}" \
              --provider openai \
              --model "${{ inputs.model }}" \
              --output live-plan-result.json
          fi

      - name: Execute deterministic validation using saved agent plan
        shell: bash
        run: |
          set +e
          if [ "${{ steps.target.outputs.kind }}" = "sql" ]; then
            agentic-qe-sql \
              --scenario "${{ steps.target.outputs.scenario }}" \
              --candidate-query "${{ steps.target.outputs.candidate }}" \
              --plan-source file \
              --plan live-plan-result.json \
              --output live-artifacts \
              --enforce-release
          else
            agentic-qe run \
              --scenario "${{ steps.target.outputs.scenario }}" \
              --candidate "examples/etl-decimal-precision/${{ steps.target.outputs.candidate }}" \
              --plan-source file \
              --plan live-plan-result.json \
              --output live-artifacts \
              --enforce-release
          fi
          echo $? > live-exit-code.txt
          exit 0

      - name: Upload live planning and evidence artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-agentic-qe-${{ inputs.experiment }}-evidence
          path: |
            live-plan-result.json
            live-artifacts/
            live-exit-code.txt
          retention-days: 14
          if-no-files-found: error

      - name: Enforce live release signal after evidence upload
        run: |
          code=$(cat live-exit-code.txt)
          if [ "$code" -ne 0 ]; then
            echo "Live pipeline returned non-zero release gate code: $code"
            exit "$code"
          fi
