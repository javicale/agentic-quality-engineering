name: Live Agentic QE Planning

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model used only for validation-plan generation
        required: true
        default: gpt-5.6-luna
        type: string
      candidate:
        description: Candidate dataset to validate
        required: true
        default: candidate-good.csv
        type: choice
        options:
          - candidate-good.csv
          - candidate-regression.csv

permissions:
  contents: read

jobs:
  live-agent-plan-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENTIC_QE_MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require configured API secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required for this manual workflow."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install live agent dependencies
        run: python -m pip install -e ".[agent]"

      - name: Generate live agent validation plan through MCP
        run: |
          agentic-qe plan \
            --scenario examples/etl-decimal-precision/scenario.json \
            --provider openai \
            --model "${{ inputs.model }}" \
            --output live-plan-result.json

      - name: Execute deterministic validation using saved agent plan
        run: |
          set +e
          agentic-qe run \
            --scenario examples/etl-decimal-precision/scenario.json \
            --candidate "examples/etl-decimal-precision/${{ inputs.candidate }}" \
            --plan-source file \
            --plan live-plan-result.json \
            --output live-artifacts \
            --enforce-release
          echo $? > live-exit-code.txt
          exit 0

      - name: Upload live planning and evidence artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-agentic-qe-evidence
          path: |
            live-plan-result.json
            live-artifacts/
            live-exit-code.txt
          retention-days: 14
          if-no-files-found: error

      - name: Enforce live release signal after evidence upload
        run: |
          code=$(cat live-exit-code.txt)
          if [ "$code" -ne 0 ]; then
            echo "Live pipeline returned non-zero release gate code: $code"
            exit "$code"
          fi
